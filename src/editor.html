<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Markdown workbench — Tadtaev</title><link rel="stylesheet" href="/style.css"><style>.shell{max-width:1100px}label{display:block;font-size:13px;margin:12px 0}input,textarea,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px}input,textarea{width:100%}textarea{height:360px;font-family:monospace;font-size:14px}button{cursor:pointer;margin:14px 8px 14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><div class="shell"><header><a href="/">← Notebook</a><span>Markdown workbench</span></header><main><h1>Write a note.</h1><p>This local workbench previews Markdown and downloads a post file. To publish, commit it to <code>content/posts/</code> and rebuild. Files stay in your browser; nothing is uploaded.</p><label>Open Markdown file<input id="file" type="file" accept=".md,text/markdown"></label><div class="grid"><section><label>Title<input id="title" value="A new note"></label><label>Date<input id="date" type="date"></label><label>Description<input id="description" value="A short description of this note."></label><label>Filename / URL slug<input id="slug" value="a-new-note" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Markdown<textarea id="body">## Start with a question

What are you thinking about?</textarea></label><button id="download">Download .md</button><p id="status" role="status"></p></section><section><p class="eyebrow">PREVIEW</p><h2 id="preview-title"></h2><div id="preview" class="prose"></div></section></div></main></div><script src="/vendor/marked.js"></script><script>
const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);function render(){$('preview-title').textContent=$('title').value;const parsed=new DOMParser().parseFromString(marked.parse($('body').value),'text/html');parsed.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,svg,math').forEach(n=>n.remove());for(const el of parsed.querySelectorAll('*')){for(const attr of [...el.attributes]){if(!['href','src','alt','title'].includes(attr.name)||(['href','src'].includes(attr.name)&&! /^(https?:|\/|#)/i.test(attr.value)))el.removeAttribute(attr.name);}if(el.tagName==='IMG')el.remove();}$('preview').replaceChildren(...parsed.body.childNodes);}for(const id of ['body','title'])$(id).addEventListener('input',render);$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;let text=await file.text();const match=text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);if(match){for(const line of match[1].split(/\r?\n/)){const m=line.match(/^(title|date|description):\s*(.*)$/);if(m){let v=m[2];try{v=JSON.parse(v)}catch{v=v.replace(/^['"]|['"]$/g,'')}$(m[1]).value=v;}}text=text.slice(match[0].length);}$('body').value=text;$('slug').value=file.name.replace(/\.md$/,'');render();};$('download').onclick=()=>{const slug=$('slug').value;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||!$('title').value.trim()||!$('date').value||!$('description').value.trim()){$('status').textContent='Complete the fields and use a lowercase slug with hyphens.';return;}const text='---\n'+['title','date','description'].map(k=>k+': '+JSON.stringify($(k).value)).join('\n')+'\n---\n\n'+$('body').value+'\n';const url=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));const a=document.createElement('a');a.href=url;a.download=slug+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Downloaded. Add the file to content/posts/ to publish.';};render();</script></html>
